<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login & Sign Up | Neumorphic Secure Access</title>
  <meta name="description" content="Secure and beautiful Neumorphic Login and Signup interface with 3D card flip and dynamic looping light focus.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="page-container">
    <!-- 3D Perspective Flip Container -->
    <div class="card-flip-container" id="flipContainer">
      <div class="card-flipper" id="cardFlipper">

        <!-- ==========================================
             FRONT FACE: LOGIN CARD
             ========================================== -->
        <div class="card-face card-front neumorphic-card" id="loginCard">
          <!-- Top Lock Icon Well (Debossed circular dish) -->
          <div class="icon-dish" id="loginIconDish" title="Security Login">
            <div class="lock-wrapper">
              <img src="assets/lock.jpg" alt="Golden Security Lock" class="lock-image" id="lockImg"
                onerror="this.style.display='none'; document.getElementById('lockSvg').style.display='block';">
              <!-- Fallback high-fidelity 3D-styled SVG lock -->
              <svg id="lockSvg" class="lock-svg" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg"
                style="display: none;">
                <defs>
                  <linearGradient id="shackleGrad" x1="18" y1="12" x2="46" y2="34" gradientUnits="userSpaceOnUse">
                    <stop stop-color="#F7D070" />
                    <stop offset="0.5" stop-color="#E2A63B" />
                    <stop offset="1" stop-color="#9C6B16" />
                  </linearGradient>
                  <linearGradient id="bodyGrad" x1="12" y1="28" x2="52" y2="56" gradientUnits="userSpaceOnUse">
                    <stop stop-color="#FFE79A" />
                    <stop offset="0.3" stop-color="#F5BD47" />
                    <stop offset="0.7" stop-color="#DDA026" />
                    <stop offset="1" stop-color="#A56E10" />
                  </linearGradient>
                  <filter id="lockShadow" x="8" y="8" width="48" height="52" filterUnits="userSpaceOnUse">
                    <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#805b10" flood-opacity="0.25" />
                  </filter>
                </defs>
                <path d="M22 30V22C22 16.4772 26.4772 12 32 12C37.5228 12 42 16.4772 42 22V30"
                  stroke="url(#shackleGrad)" stroke-width="6" stroke-linecap="round" />
                <rect x="14" y="27" width="36" height="28" rx="7" fill="url(#bodyGrad)" filter="url(#lockShadow)" />
                <rect x="15" y="28" width="34" height="6" rx="3" fill="#FFF2C6" fill-opacity="0.6" />
                <circle cx="32" cy="39" r="3.2" fill="#5A3A05" />
                <path d="M30.6 40.5L29.8 47H34.2L33.4 40.5H30.6Z" fill="#5A3A05" />
                <g transform="translate(41, 44) rotate(-35) scale(0.65)">
                  <circle cx="10" cy="10" r="7" stroke="url(#bodyGrad)" stroke-width="3" fill="none" />
                  <rect x="15" y="8.5" width="16" height="3" rx="1.5" fill="url(#bodyGrad)" />
                  <rect x="25" y="11.5" width="3" height="4" rx="1" fill="url(#bodyGrad)" />
                  <rect x="29" y="11.5" width="2.5" height="3" rx="1" fill="url(#bodyGrad)" />
                </g>
              </svg>
            </div>
          </div>

          <!-- Header Section -->
          <header class="card-header">
            <h1 class="card-title">Welcome Back</h1>
            <p class="card-subtitle">Sign in with your credentials to continue</p>
          </header>

          <!-- Login Form -->
          <form id="loginForm" class="auth-form" onsubmit="return false;" novalidate>
            <!-- Username / Email Input Box -->
            <div class="input-slot-group">
              <label for="loginUsername" class="slot-label">Username or Email</label>
              <div class="neumorphic-input-box" id="boxLoginUsername">
                <span class="slot-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                  </svg>
                </span>
                <input type="text" id="loginUsername" name="username" placeholder="Enter username or email"
                  autocomplete="username" required>
                <!-- Animated Thin Blue Light Looping Border -->
                <svg class="beam-border-svg" aria-hidden="true">
                  <rect class="beam-rect" x="1.5" y="1.5" rx="16" ry="16" pathLength="100"></rect>
                </svg>
              </div>
            </div>

            <!-- Password Input Box -->
            <div class="input-slot-group">
              <label for="loginPassword" class="slot-label">Password</label>
              <div class="neumorphic-input-box" id="boxLoginPassword">
                <span class="slot-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                  </svg>
                </span>
                <input type="password" id="loginPassword" name="password" placeholder="Enter your password"
                  autocomplete="current-password" required>
                <button type="button" class="toggle-password-btn" aria-label="Toggle password visibility"
                  data-target="loginPassword">
                  <svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                  </svg>
                  <svg class="eye-off-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                    <path
                      d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24">
                    </path>
                    <line x1="1" y1="1" x2="23" y2="23"></line>
                  </svg>
                </button>
                <!-- Animated Thin Blue Light Looping Border -->
                <svg class="beam-border-svg" aria-hidden="true">
                  <rect class="beam-rect" x="1.5" y="1.5" rx="16" ry="16" pathLength="100"></rect>
                </svg>
              </div>
            </div>

            <!-- Login Options: Remember Me & Forgot Password -->
            <div class="form-options-row">
              <label class="custom-checkbox-wrapper">
                <input type="checkbox" id="rememberMe" checked>
                <span class="neumorphic-checkbox">
                  <svg class="check-mark-svg" viewBox="0 0 12 10" fill="none">
                    <path d="M1 5l3.5 3.5L11 1" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"
                      stroke-linejoin="round" />
                  </svg>
                </span>
                <span class="checkbox-label">Remember me</span>
              </label>
              <button type="button" class="text-link" id="forgotPassBtn">Forgot password?</button>
            </div>

            <!-- Feedback message container -->
            <div class="feedback-message" id="loginFeedbackMessage" role="alert"></div>

            <!-- LOG IN Button (Convex Neumorphic Button with Tactile Animation) -->
            <button type="submit" class="verify-button" id="loginBtn">
              <span class="button-text">LOG IN</span>
              <span class="button-loader" aria-hidden="true"></span>
              <span class="button-ripple" aria-hidden="true"></span>
            </button>

            <!-- Switch to Signup Option -->
            <div class="card-switch-wrapper">
              <span class="switch-prompt">Don't have an account?</span>
              <button type="button" class="resend-link flip-to-signup-btn" id="toSignupBtn">
                SIGN UP
              </button>
            </div>
          </form>
        </div>


        <!-- ==========================================
             BACK FACE: SIGNUP CARD (Flipped Left)
             ========================================== -->
        <div class="card-face card-back neumorphic-card" id="signupCard">
          <!-- Top User Dish (Sunken circular well) -->
          <div class="icon-dish" id="signupIconDish" title="Create Account">
            <div class="lock-wrapper">
              <svg class="signup-top-svg" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                <defs>
                  <linearGradient id="userGrad" x1="10" y1="8" x2="38" y2="40" gradientUnits="userSpaceOnUse">
                    <stop stop-color="#FFE79A" />
                    <stop offset="0.4" stop-color="#F5BD47" />
                    <stop offset="0.8" stop-color="#DDA026" />
                    <stop offset="1" stop-color="#A56E10" />
                  </linearGradient>
                </defs>
                <circle cx="21" cy="16" r="8" fill="url(#userGrad)" stroke="#A56E10" stroke-width="1.5" />
                <path d="M9 36C9 29.3726 14.3726 24 21 24C27.6274 24 33 29.3726 33 36" stroke="url(#userGrad)"
                  stroke-width="4" stroke-linecap="round" />
                <circle cx="37" cy="18" r="6.5" fill="#2563eb" />
                <path d="M37 14.5V21.5M33.5 18H40.5" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
              </svg>
            </div>
          </div>

          <!-- Header Section -->
          <header class="card-header">
            <h2 class="card-title">Create Account</h2>
            <p class="card-subtitle">Fill in your information to join us</p>
          </header>

          <!-- Signup Form with Required Slots -->
          <form id="signupForm" class="auth-form" onsubmit="return false;" novalidate>
            <!-- Slot 1: Full Name -->
            <div class="input-slot-group">
              <label for="signupName" class="slot-label">Full Name</label>
              <div class="neumorphic-input-box" id="boxSignupName">
                <span class="slot-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                  </svg>
                </span>
                <input type="text" id="signupName" name="fullName" placeholder="e.g. Alex Morgan"
                  autocomplete="name" required>
                <!-- Animated Thin Blue Light Looping Border -->
                <svg class="beam-border-svg" aria-hidden="true">
                  <rect class="beam-rect" x="1.5" y="1.5" rx="16" ry="16" pathLength="100"></rect>
                </svg>
              </div>
            </div>

            <!-- Slot 2: Email Address -->
            <div class="input-slot-group">
              <label for="signupEmail" class="slot-label">Email Address</label>
              <div class="neumorphic-input-box" id="boxSignupEmail">
                <span class="slot-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                    <polyline points="22,6 12,13 2,6"></polyline>
                  </svg>
                </span>
                <input type="email" id="signupEmail" name="email" placeholder="name@example.com"
                  autocomplete="email" required>
                <!-- Animated Thin Blue Light Looping Border -->
                <svg class="beam-border-svg" aria-hidden="true">
                  <rect class="beam-rect" x="1.5" y="1.5" rx="16" ry="16" pathLength="100"></rect>
                </svg>
              </div>
            </div>

            <!-- Slot 3: Password -->
            <div class="input-slot-group">
              <label for="signupPassword" class="slot-label">Create Password</label>
              <div class="neumorphic-input-box" id="boxSignupPassword">
                <span class="slot-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                  </svg>
                </span>
                <input type="password" id="signupPassword" name="password" placeholder="Min. 6 characters"
                  autocomplete="new-password" required>
                <button type="button" class="toggle-password-btn" aria-label="Toggle password visibility"
                  data-target="signupPassword">
                  <svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                  </svg>
                  <svg class="eye-off-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                    <path
                      d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24">
                    </path>
                    <line x1="1" y1="1" x2="23" y2="23"></line>
                  </svg>
                </button>
                <!-- Animated Thin Blue Light Looping Border -->
                <svg class="beam-border-svg" aria-hidden="true">
                  <rect class="beam-rect" x="1.5" y="1.5" rx="16" ry="16" pathLength="100"></rect>
                </svg>
              </div>
            </div>

            <!-- Slot 4: Confirm Password -->
            <div class="input-slot-group">
              <label for="signupConfirmPassword" class="slot-label">Confirm Password</label>
              <div class="neumorphic-input-box" id="boxSignupConfirm">
                <span class="slot-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                    <path d="m9 12 2 2 4-4"></path>
                  </svg>
                </span>
                <input type="password" id="signupConfirmPassword" name="confirmPassword" placeholder="Repeat your password"
                  autocomplete="new-password" required>
                <button type="button" class="toggle-password-btn" aria-label="Toggle password visibility"
                  data-target="signupConfirmPassword">
                  <svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                  </svg>
                  <svg class="eye-off-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                    <path
                      d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24">
                    </path>
                    <line x1="1" y1="1" x2="23" y2="23"></line>
                  </svg>
                </button>
                <!-- Animated Thin Blue Light Looping Border -->
                <svg class="beam-border-svg" aria-hidden="true">
                  <rect class="beam-rect" x="1.5" y="1.5" rx="16" ry="16" pathLength="100"></rect>
                </svg>
              </div>
            </div>

            <!-- Terms Checkbox -->
            <div class="form-options-row">
              <label class="custom-checkbox-wrapper">
                <input type="checkbox" id="agreeTerms" checked>
                <span class="neumorphic-checkbox">
                  <svg class="check-mark-svg" viewBox="0 0 12 10" fill="none">
                    <path d="M1 5l3.5 3.5L11 1" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"
                      stroke-linejoin="round" />
                  </svg>
                </span>
                <span class="checkbox-label">I agree to the <a href="#" class="text-link" onclick="return false;">Terms</a> & <a href="#" class="text-link" onclick="return false;">Privacy</a></span>
              </label>
            </div>

            <!-- Feedback message container -->
            <div class="feedback-message" id="signupFeedbackMessage" role="alert"></div>

            <!-- SIGN UP Button (Convex Neumorphic Button with Tactile Animation) -->
            <button type="submit" class="verify-button" id="signupBtn">
              <span class="button-text">CREATE ACCOUNT</span>
              <span class="button-loader" aria-hidden="true"></span>
              <span class="button-ripple" aria-hidden="true"></span>
            </button>

            <!-- Switch to Login Option -->
            <div class="card-switch-wrapper">
              <span class="switch-prompt">Already have an account?</span>
              <button type="button" class="resend-link flip-to-login-btn" id="toLoginBtn">
                LOG IN
              </button>
            </div>
          </form>
        </div>

      </div>
    </div>

    <!-- Neumorphic Surface Preset Switcher (Clay, Soft Blue, Dark Clay) -->
    <nav class="palette-switcher" aria-label="Surface Color Themes">
      <button type="button" class="palette-btn active" data-theme-set="default">Clay</button>
      <button type="button" class="palette-btn" data-theme-set="soft-blue">Soft Blue</button>
      <button type="button" class="palette-btn" data-theme-set="dark">Dark Clay</button>
    </nav>
  </main>

  <!-- Success Modal Dialog (Neumorphic Card) -->
  <div class="modal-overlay" id="successModal" aria-hidden="true">
    <div class="modal-card">
      <div class="success-icon-well">
        <svg class="check-svg" viewBox="0 0 52 52">
          <circle class="check-circle" cx="26" cy="26" r="23" fill="none" />
          <path class="check-tick" fill="none" d="M14.1 27.2l7.1 7.2 16.7-16.8" />
        </svg>
      </div>
      <h2 class="modal-title" id="modalTitle">Welcome Back!</h2>
      <p class="modal-desc" id="modalDesc">You have successfully authenticated.</p>
      <button type="button" class="modal-button" id="modalDismissBtn">Continue to Dashboard</button>
    </div>
  </div>

  <!-- Toast Notification -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>

</html>
